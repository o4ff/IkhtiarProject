<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title data-i18n="title.survey">الاستبيان | Ikhtiar</title>
  
  <link rel="stylesheet" href="assets/css/theme.css" />
  <link rel="stylesheet" href="assets/css/util.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&family=Tajawal:wght@300;400;700;900&display=swap" rel="stylesheet">
</head>
<body data-theme="dark">

  <div class="ambient-glow purple"></div>
  <div class="ambient-glow green"></div>

  <div data-include="partials/nav"></div>

  <main class="container narrow fade-in" role="main">
    
    <div class="mb-2">
      <button class="btn ghost icon" id="backBtn" type="button">
        <span style="font-size: 1.2rem;">←</span> <span data-i18n="ui.back">رجوع</span>
      </button>
    </div>
    
    <div class="card glass-effect" style="position:relative; overflow:visible; padding: 40px;">
      
      <div class="text-center mb-2">
        <h1 class="section-title text-gradient" data-i18n="survey.title">استبيان تحديد المسار</h1>
        <p class="muted" data-i18n="survey.helper">اختر مهاراتك واهتماماتك بدقة (يمكنك اختيار أكثر من واحدة).</p>
      </div>

      <form id="surveyForm" class="stack mt-4">
        
        <div style="position:relative; z-index: 20;">
          <label class="input-label">
            <span class="icon">⚡</span>
            <span data-i18n="survey.strengths">نقاط قوتك / مهاراتك</span>
          </label>
          <div id="ms_strengths" class="multi-select-wrapper"></div>
        </div>

        <div style="position:relative; z-index: 15;">
          <label class="input-label">
            <span class="icon">💡</span>
            <span data-i18n="survey.interests">اهتماماتك التقنية</span>
          </label>
          <div id="ms_interests" class="multi-select-wrapper"></div>
        </div>

        <div style="position:relative; z-index: 10;">
          <label class="input-label">
            <span class="icon">🧠</span>
            <span data-i18n="survey.style">كيف تفضل أن تتعلم؟</span>
          </label>
          <div class="select-wrapper">
            <select name="style" id="sel_style" required>
              <option value="visual" data-i18n="survey.style.visual">بصري (فيديوهات وصور)</option>
              <option value="auditory" data-i18n="survey.style.auditory">سمعي (محاضرات وشرح صوتي)</option>
              <option value="kinesthetic" data-i18n="survey.style.kinesthetic">عملي (تطبيق وتجربة باليد)</option>
            </select>
          </div>
        </div>

        <div style="position:relative; z-index: 5;">
          <label class="input-label">
            <span class="icon">🎯</span>
            <span data-i18n="survey.goals">ما هو هدفك المهني؟</span>
          </label>
          <div class="select-wrapper">
            <select name="goals" id="sel_goals" required></select>
          </div>
        </div>

        <div class="mt-4 text-center">
          <button class="btn primary glow-btn w-full big-btn" type="submit">
            <span data-i18n="survey.submit">تحليل وإظهار النتائج</span>
            <span class="icon-arrow">✨</span>
          </button>
        </div>
      </form>
    </div>
  </main>

  <div data-include="partials/footer"></div>
  
  <script src="assets/js/i18n.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/supa.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/dataService.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
